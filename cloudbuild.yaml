# CI/CD for the Diamond Labs API (Cloud Run).
#
# Triggered automatically on push to `main` (trigger: deploy-api-on-main).
# Pipeline: build image -> push -> run DB migrations -> deploy service ->
# point the jobs Job at the new image (skipped while that Job doesn't exist).
# The migrate step runs BEFORE deploy and is a hard gate: if migrations fail,
# the new revision is never rolled out.
#
# The `update-jobs` step (diamond-labs-jobs, the AutoPay sweep + future
# scheduled jobs) only points the Job at the new image — it never executes
# it. Cloud Scheduler triggers runs on its own cadence, independent of
# deploys. See docs/autopay-operations.md for the one-time Job + Scheduler
# setup and the go-live checklist that gates turning charging on.
#
# Manual run (SHORT_SHA is only populated on trigger builds — pass it):
#   gcloud builds submit --config cloudbuild.yaml --project diamond-labs-prod \
#     --substitutions=SHORT_SHA="$(git rev-parse --short HEAD)"
substitutions:
  _REGION: us-central1
  _REPO: us-central1-docker.pkg.dev/diamond-labs-prod/diamond-labs/api
  _SERVICE: diamond-labs-api
  _MIGRATE_JOB: diamond-labs-migrate
  _JOBS_JOB: diamond-labs-jobs

steps:
  # 1. Build the API image from the monorepo root (Dockerfile COPY paths are
  #    repo-root-relative). Tag with the commit SHA and `latest`.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REPO}:${SHORT_SHA}
      - -t
      - ${_REPO}:latest
      - .

  # 2. Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REPO}"]

  # 3. Point the migrate Job at the freshly built image and run it to apply any
  #    pending Drizzle migrations. --wait makes the step fail (and abort the
  #    deploy) if migrations error. The Job carries DATABASE_URL + the Cloud SQL
  #    socket, so it connects exactly like the service.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_MIGRATE_JOB}
      - --image=${_REPO}:${SHORT_SHA}
      - --region=${_REGION}
      - --execute-now
      - --wait

  # 4. Deploy the new revision of the service.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}:${SHORT_SHA}
      - --region=${_REGION}

  # 5. Point the jobs Cloud Run Job at the freshly built image. NOT executed
  #    here — Cloud Scheduler invokes it on its own cadence. Deploying must
  #    never trigger a payment sweep, so this step MUST NEVER gain
  #    --execute-now: unlike the migrate step above, an accidental run here
  #    would charge every enrolled doctor's card.
  #
  #    Runs AFTER deploy, so a failed service rollout never leaves the Job on
  #    an image the service rejected. Skips (rather than failing the build)
  #    while the Job does not exist yet: it is created by hand per
  #    docs/autopay-operations.md section 1.3, and until then an unconditional
  #    `jobs update` would fail every deploy of main.
  - id: update-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run jobs describe ${_JOBS_JOB} --region=${_REGION} > /dev/null 2>&1; then
          gcloud run jobs update ${_JOBS_JOB} --image=${_REPO}:${SHORT_SHA} --region=${_REGION}
        else
          echo "${_JOBS_JOB} does not exist yet (docs/autopay-operations.md section 1.3) - skipping"
        fi

images:
  - ${_REPO}:latest
  - ${_REPO}:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
