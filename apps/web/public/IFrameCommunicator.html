<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>IFrame Communicator</title>
  <script type="text/javascript">
    // Authorize.net Accept Hosted relay. The hosted payment page loads this
    // page (same-origin with our app) and posts transaction events to it; we
    // forward them up to the parent window via postMessage. The parent listens
    // for "message" events and validates the action payload.
    function callParentFunction(str) {
      if (str && str.length > 0 && window.parent && window.parent.parent) {
        var referrer = document.referrer;
        window.parent.parent.postMessage(str, referrer !== "" ? referrer : "*");
      }
    }
    function receiveMessage(event) {
      if (event && event.data) {
        callParentFunction(event.data);
      }
    }
    if (window.addEventListener) {
      window.addEventListener("message", receiveMessage, false);
    } else if (window.attachEvent) {
      window.attachEvent("onmessage", receiveMessage);
    }
    // The hosted page also navigates this iframe with the response in the hash.
    if (window.location.hash && window.location.hash.length > 1) {
      callParentFunction(window.location.hash.substring(1));
    }
  </script>
</head>
<body></body>
</html>
